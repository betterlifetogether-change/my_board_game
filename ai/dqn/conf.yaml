# 环境参数
env:
  module_name: game_env.four_in_row
  class_name: FourInRowEnv


# 训练参数
train:
  num_episode: 100000
  max_episode_step: 100
  test_per_episode: 1000
  selfplay_update_per_episode: 100

  buffer_size: 5000
  batch_size: 128
  epsilon: 0.1
  gamma: 0.9
  lr: 0.00001
  tar_net_update_freq: 500

# 模型网络参数
net:
  out_channels: [16, 16]
  kernel_sizes: [4, 5]
  strides: [1, 1]
  paddings: [2, 0]
  use_bn: false
  dropout_p: 0.1
  fc_hidden_dims: [1024, 512, 128]