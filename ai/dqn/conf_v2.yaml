# 环境参数
env:
  module_name: game_env.four_in_row
  class_name: FourInRowEnv


# 测试参数
test:
  num_episode: 100
  max_episode_step: 125


# 训练参数
train:
  num_episode: 10000
  max_episode_step: 125
  test_per_episode: 1000
  selfplay_update_per_episode: 1000

  buffer_size: 50000
  batch_size: 256
  epsilon: 0.1
  gamma: 0.9
  lr: 0.00001
  tar_net_update_freq: 1000

# 模型网络参数
net:
  out_channels: [64, 64, 2]
  kernel_sizes: [3, 3, 3]
  strides: [1, 1, 1]
  paddings: [1, 1, 1]
  use_bn: true
  dropout_p: 0.0
  fc_hidden_dims: [1024, 512, 128]